name: ci

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      stress:
        description: Include original containment stress scales at a delivery checkpoint
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      # The solution includes the probe, which dotnet test does not build.
      # Finish all compilation before suspension/cancellation checks start.
      - name: Build Release solution
        shell: pwsh
        run: dotnet build Lokad.Lython.slnx -c Release
      - name: Test Release
        shell: pwsh
        env:
          # N35: capture a dump on testhost abort without affecting green runs.
          DOTNET_DbgEnableMiniDump: 1
          DOTNET_DbgMiniDumpType: Mini
          DOTNET_DbgMiniDumpName: ${{ github.workspace }}/crash-%p.dmp
        run: |
          try { dotnet test Lokad.Lython.slnx -c Release --no-build --blame-crash --blame-crash-dump-type mini --blame-hang-timeout 5m --blame-hang-dump-type mini 2>&1 | Tee-Object -FilePath test.log } catch { exit 1 }
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Verify Release package consumer
        shell: pwsh
        run: ./tools/PackageSmokeTest/verify-package.ps1
      - name: Test original stress scales
        if: github.event_name == 'workflow_dispatch' && inputs.stress
        shell: pwsh
        run: |
          try { dotnet test Lokad.Lython.slnx -c Release --no-build --filter 'Category=Stress' --blame-crash --blame-crash-dump-type mini --blame-hang-timeout 5m --blame-hang-dump-type mini 2>&1 | Tee-Object -FilePath stress-test.log } catch { exit 1 }
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Publish crash dumps
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: crash-dumps-${{ matrix.os }}
          path: |
            ${{ github.workspace }}/crash-*.dmp
            ${{ github.workspace }}/**/TestResults/**/Sequence_*.xml
            ${{ github.workspace }}/**/TestResults/**/*.dmp
          if-no-files-found: ignore
      - name: Publish test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log-${{ matrix.os }}
          path: |
            test.log
            stress-test.log
