name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      # Two suites shell out to LythonProbe.dll, which no test project
      # references, so plain `dotnet test` never builds it: build the probe
      # explicitly first (same rule as local development).
      - name: Build probe
        shell: pwsh
        run: dotnet build tools/LythonProbe/LythonProbe.csproj -c Release
      - name: Test Release
        shell: pwsh
        env:
          # N35: capture a dump on testhost abort without affecting green runs.
          DOTNET_DbgEnableMiniDump: 1
          DOTNET_DbgMiniDumpType: Mini
          DOTNET_DbgMiniDumpName: ${{ github.workspace }}/crash-%p.dmp
        run: |
          try { dotnet test Lokad.Lython.slnx -c Release 2>&1 | Tee-Object -FilePath test.log } catch { exit 1 }
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Publish crash dumps
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: crash-dumps-${{ matrix.os }}
          path: ${{ github.workspace }}/crash-*.dmp
          if-no-files-found: ignore
      - name: Publish test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log-${{ matrix.os }}
          path: test.log